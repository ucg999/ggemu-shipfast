<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#063f42" />
    <title>Pokemon LeafGreen - GBA</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="console-shell">
      <header class="brand-row">
        <span class="system">GAME BOY ADVANCE</span>
        <span class="brand">UCG999.怀旧游戏厅</span>
      </header>
      <section class="screen-frame" aria-label="GBA 游戏画面">
        <div id="game"></div>
        <img class="screen-mask" src="./assets/gb-mask.png" alt="" />
        <div id="loading-tip">正在载入 GBA 游戏……</div>
      </section>
      <section class="controls" aria-label="GBA 虚拟按键"></section>
      <nav class="function-bar" aria-label="游戏功能">
        <button data-action="save">存档</button>
        <button data-action="load">读档</button>
        <button data-action="record">录像</button>
        <button data-action="pause">暂停</button>
      </nav>
    </main>

    <script>
      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_controlScheme = 'gba';
      window.EJS_gameName = 'Pocket Monster - LeafGreen (JP)';
      window.EJS_gameID = 10001;
      window.EJS_gameUrl = './assets/game.zip';
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_language = 'zh-CN';
      window.EJS_startOnLoaded = true;
      window.EJS_threads = false;
      window.EJS_volume = 0.7;
      window.EJS_fixedSaveInterval = 30000;
      window.EJS_Buttons = {
        playPause: true,
        restart: true,
        mute: true,
        settings: true,
        fullscreen: true,
        saveState: true,
        loadState: true,
        screenRecord: true,
        gamepad: true,
        cheat: false,
        volume: true,
        saveSavFiles: true,
        loadSavFiles: true,
        quickSave: true,
        quickLoad: true,
        screenshot: false,
        cacheManager: false,
        exitEmulation: false
      };
      window.EJS_VirtualGamepadSettings = [
        { type: 'dpad', location: 'left', left: '50%', right: '50%', joystickInput: false, inputValues: [4, 5, 6, 7] },
        { type: 'button', text: 'B', id: 'gba-b', location: 'right', left: 18, top: 62, bold: true, input_value: 0 },
        { type: 'button', text: 'A', id: 'gba-a', location: 'right', left: 82, top: 28, bold: true, input_value: 8 },
        { type: 'button', text: 'L', id: 'gba-l', location: 'left', left: 12, top: -36, fontSize: 20, bold: true, input_value: 10 },
        { type: 'button', text: 'R', id: 'gba-r', location: 'right', left: 112, top: -36, fontSize: 20, bold: true, input_value: 11 },
        { type: 'button', text: 'SELECT', id: 'gba-select', location: 'center', left: -64, top: 12, fontSize: 12, block: true, input_value: 2 },
        { type: 'button', text: 'START', id: 'gba-start', location: 'center', left: 42, top: 12, fontSize: 12, block: true, input_value: 3 }
      ];
      window.EJS_ready = function () {
        var tip = document.getElementById('loading-tip');
        if (tip) tip.remove();
      };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    <script src="./assets/controls.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">从4399小游戏到游戏历险记</title>
  <desc id="desc">复古浏览器窗口、街机摇杆和掌机像素元素组成的原创博客封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g opacity=".12" fill="#fff">
    <rect x="60" y="110" width="24" height="24"/><rect x="108" y="110" width="24" height="24"/>
    <rect x="1110" y="270" width="20" height="20"/><rect x="1066" y="270" width="20" height="20"/>
    <rect x="80" y="1010" width="18" height="18"/><rect x="116" y="1010" width="18" height="18"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="135" width="970" height="690" rx="50" fill="#f8fafc"/>
    <rect x="115" y="135" width="970" height="100" rx="50" fill="#e2e8f0"/>
    <rect x="115" y="185" width="970" height="50" fill="#e2e8f0"/>
    <circle cx="180" cy="185" r="15" fill="#fb7185"/>
    <circle cx="230" cy="185" r="15" fill="#facc15"/>
    <circle cx="280" cy="185" r="15" fill="#4ade80"/>
    <rect x="345" y="165" width="610" height="40" rx="20" fill="#fff"/>
  </g>
  <g transform="translate(245 325)">
    <rect width="710" height="350" rx="30" fill="#111827"/>
    <rect x="28" y="28" width="654" height="294" rx="18" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <path d="M135 210h90v-55h55v55h90v55h-90v55h-55v-55h-90z" fill="#f8fafc" transform="translate(0 -45)"/>
    <circle cx="500" cy="180" r="40" fill="#fb7185"/>
    <circle cx="590" cy="235" r="40" fill="#60a5fa"/>
    <rect x="470" y="85" width="150" height="28" rx="14" fill="#facc15"/>
  </g>
  <text x="600" y="930" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="72" font-weight="800" text-anchor="middle">从4399小游戏</text>
  <text x="600" y="1025" fill="url(#accent)" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="66" font-weight="800" text-anchor="middle">到游戏历险记</text>
  <text x="600" y="1100" fill="#cbd5e1" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" text-anchor="middle" letter-spacing="8">打开即玩 · 快乐无需等待</text>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d6d6d8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FC收藏馆｜Waixing01</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <div id="top-actions" aria-label="页面操作">
      <button id="btn-favorite" type="button" aria-label="收藏FC收藏馆" aria-pressed="false" title="收藏">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" />
        </svg>
      </button>
      <span aria-hidden="true"></span>
      <button id="btn-share" type="button" aria-label="分享FC收藏馆" title="分享">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 3v12m0-12-4 4m4-4 4 4M6 11v8h12v-8" />
        </svg>
      </button>
    </div>
    <div id="toolbar">
      <button id="btn-save">存档</button>
      <button id="btn-load">读档</button>
      <button id="btn-shot">录像</button>
      <button id="btn-record">暂停</button>
    </div>
    <canvas id="main-canvas"></canvas>
    <script src="./assets/jsnes.min.js"></script>
    <script src="./assets/config.js"></script>
    <script src="./assets/rom.js"></script>
    <script src="./assets/core.js"></script>
    <script src="./assets/shell.js"></script>
  </body>
</html>
